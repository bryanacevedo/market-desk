# The public demo as a static snapshot (docs/RUNBOOK.md, Static snapshot). Builds Lumen Ledger's demo on a throwaway
# Postgres, reads it the way the screens do, and keeps the bundle as an artifact. It deploys to Cloudflare Pages
# (project market-desk-demo) only when both Cloudflare secrets are set; without them the run still builds and passes.
name: static snapshot

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "web/**"
      - "src/**"
      - "world/**"
      - "migrations/**"
      - "scripts/build_static_snapshot.py"
      - "scripts/static_snapshot/**"
      - ".github/workflows/static-snapshot.yml"

concurrency:
  group: static-snapshot
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    services:
      postgres:
        image: postgres:18
        env:
          POSTGRES_HOST_AUTH_METHOD: trust
          POSTGRES_DB: market
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U postgres" --health-interval 5s --health-timeout 5s --health-retries 20
    env:
      DATABASE_URL: postgres://postgres@127.0.0.1:5432/market
      NO_WORKER: "1"
      PUBLIC_DEMO: "1"
      PYTHONPATH: src
      HAS_CLOUDFLARE: ${{ secrets.CLOUDFLARE_API_TOKEN != '' && secrets.CLOUDFLARE_ACCOUNT_ID != '' }}
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
        with:
          python-version: "3.13"
      - uses: actions/setup-node@v4
        with:
          node-version: "26"
          cache: npm
          cache-dependency-path: web/package-lock.json
      - name: Install
        run: |
          uv sync --frozen
          cd web && npm ci --no-audit --no-fund
      - name: Build the demo database
        run: .venv/bin/python -m market demo
      - name: Build the snapshot
        run: .venv/bin/python scripts/build_static_snapshot.py --out .snapshot
      - uses: actions/upload-artifact@v4
        with:
          name: market-desk-snapshot-${{ github.sha }}
          path: .snapshot
          retention-days: 30
          include-hidden-files: true
      - name: Deploy to Cloudflare Pages
        if: env.HAS_CLOUDFLARE == 'true'
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: npx --yes wrangler@4.156.1 pages deploy .snapshot --project-name market-desk-demo --branch main --commit-hash "${{ github.sha }}" --commit-dirty=true
      - name: No Cloudflare secrets, so no deploy
        if: env.HAS_CLOUDFLARE != 'true'
        run: echo "CLOUDFLARE_API_TOKEN or CLOUDFLARE_ACCOUNT_ID is not set. The bundle is in this run's artifacts; nothing was deployed."
