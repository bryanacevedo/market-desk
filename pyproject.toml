[project]
name = "market-desk"
version = "0.1.0"
description = "ICP, market and territories: who a B2B team sells to, decided from evidence."
requires-python = ">=3.13,<3.14"
license = { text = "PolyForm-Noncommercial-1.0.0" }
authors = [{ name = "Bryan Acevedo" }]
dependencies = [
  "fastapi>=0.115",
  "uvicorn[standard]>=0.32",
  "psycopg[binary,pool]>=3.2",
  "pydantic>=2.9",
  "anthropic>=1.0",
  "mcp>=1.2",
  "httpx>=0.27",
  "pyjwt[crypto]>=2.9",
]

[dependency-groups]
dev = ["pytest>=8.3", "pytest-xdist>=3.6", "ruff>=0.8"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/market"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q -p no:cacheprovider"

[tool.ruff]
line-length = 110
target-version = "py313"

[tool.ruff.lint]
select = ["E", "F", "W", "B", "I"]
ignore = ["E501", "B008", "UP017", "B905", "E731"]
